<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <meta name="theme-color" content="#f5f0eb" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/cormorant-garamond-300-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-300-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Plain version of the page, shown until the app starts (and to search engines) */
      html { background: #f5f0eb; color: #3a322b; }
      body { margin: 0; }
      .seo-static { font: 15px/1.7 'Manrope', system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 120px 20px 64px; }
      .seo-static a { color: inherit; }
      .seo-static header { position: fixed; inset: 0 0 auto; display: flex; justify-content: space-between; gap: 16px; padding: 24px 20px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      .seo-static header nav { display: none; }
      .seo-static .seo-hero { min-height: calc(100vh - 200px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .seo-static h1 { margin: 0; font: 300 clamp(48px, 11vw, 132px)/1 'Cormorant Garamond', Georgia, serif; }
      .seo-static h1 span { display: block; margin-bottom: 24px; font: 500 11px 'Manrope', system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #7f6a4f; }
      .seo-static .seo-hero p { max-width: 28rem; opacity: .75; }
      .seo-static h2 { margin: 72px 0 16px; font: 300 40px/1.05 'Cormorant Garamond', Georgia, serif; }
      .seo-static h3 { font: 400 22px/1.2 'Cormorant Garamond', Georgia, serif; }
      .seo-static img { display: block; width: 240px; max-width: 100%; height: auto; }
      .seo-static blockquote { margin: 24px 0; font: italic 300 22px/1.4 'Cormorant Garamond', Georgia, serif; }
    </style>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
