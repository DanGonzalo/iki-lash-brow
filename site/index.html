<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <meta name="theme-color" content="#15100e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/geist-pixel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Plain version of the page, shown until the app starts (and to search engines) */
      html { background: #15100e; color: #f4ece4; }
      body { margin: 0; }
      .seo-static { font: 14px/1.65 'Geist Mono', ui-monospace, monospace; max-width: 860px; margin: 0 auto; padding: 120px 20px 64px; }
      .seo-static a { color: inherit; }
      .seo-static header { position: fixed; inset: 0 0 auto; display: flex; justify-content: space-between; gap: 16px; padding: 24px 20px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      .seo-static header nav { display: none; }
      .seo-static .seo-hero { min-height: calc(100vh - 200px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .seo-static h1 { margin: 0; font: 400 clamp(44px, 11vw, 140px)/.88 'Geist Pixel', ui-monospace, monospace; text-transform: uppercase; }
      .seo-static h1 span { display: block; margin-bottom: 24px; font: 11px 'Geist Mono', ui-monospace, monospace; letter-spacing: .25em; color: #d9a19a; }
      .seo-static .seo-hero p { max-width: 28rem; opacity: .7; }
      .seo-static h2 { margin: 72px 0 16px; font: 400 34px/1 'Geist Pixel', ui-monospace, monospace; text-transform: uppercase; }
      .seo-static h3 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
      .seo-static img { display: block; width: 240px; max-width: 100%; height: auto; }
      .seo-static blockquote { margin: 24px 0; }
    </style>
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
